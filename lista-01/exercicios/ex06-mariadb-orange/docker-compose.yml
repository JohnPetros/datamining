services:
  mariadb:
    image: mariadb:11.4
    container_name: datamining-mariadb-ex06
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: datamining_root
      MARIADB_DATABASE: datamining_ex06
      MARIADB_USER: datamining
      MARIADB_PASSWORD: datamining
    ports:
      - "3307:3306"
    volumes:
      - mariadb_ex06_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mariadb_ex06_data:
